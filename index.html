<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Student Task Manager</h1>

    <form id="taskForm" class="task-form">
      <label for="taskTitle">Task Title</label>
      <input type="text" id="taskTitle" placeholder="e.g. Finish Git assignment" required>

      <label for="taskDescription">Description</label>
      <textarea id="taskDescription" rows="3" placeholder="Short description of the task"></textarea>

      <button type="submit" id="addBtn" class="btn btn-primary">Add Task</button>
    </form>

    <section class="task-section">
      <h2>My Tasks</h2>
      <ul id="taskList" class="task-list"></ul>
      <p id="emptyMessage" class="empty-message">No tasks yet. Add your first task above.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
